apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestionar
  namespace: gestionar
  labels:
    app: gestionar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestionar
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: gestionar
    spec:
      containers:
        - name: gestionar
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/data/sarcini.db
          envFrom:
            - secretRef:
                name: gestionar-secret
          volumeMounts:
            - name: data
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gestionar-data
